<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>页面已下线 · 孵蛋模拟器</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e6e8ee;
    --ink:#1c2028; --ink-2:#5b6472; --ink-3:#8b93a1; --accent:#4f46e5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:32px 28px;text-align:center;
    box-shadow:0 8px 28px -18px rgba(28,32,40,.28);
  }
  .ic{
    width:46px;height:46px;margin:0 auto 16px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(79,70,229,.08);color:var(--accent);
  }
  .ic svg{width:24px;height:24px;display:block}
  h1{margin:0 0 8px;font-size:17px;font-weight:650;letter-spacing:.01em}
  p{margin:0 0 20px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
  a.btn{
    display:inline-block;padding:9px 20px;border-radius:10px;
    background:var(--accent);color:#fff;text-decoration:none;
    font-size:13.5px;font-weight:600;letter-spacing:.02em;
  }
  a.btn:hover{opacity:.9}
  .foot{margin-top:16px;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
  <main class="card">
    <div class="ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M5.6 5.6l12.8 12.8"></path>
      </svg>
    </div>
    <h1>此页面已下线</h1>
    <p>孵蛋模拟器已移除数据埋点与数据看板，本页面不再提供服务。<br>你可以在下方回到模拟器主页。</p>
    <a class="btn" href="../">返回孵蛋模拟器</a>
    <div class="foot">洛克王国世界 · 孵蛋模拟器 · 光环助手整理发布</div>
  </main>
  <script>
    // 3 秒后自动回主页（保留手动按钮，避免打断正在阅读的用户）
    setTimeout(function(){ location.replace('../'); }, 3000);
  </script>
</body>
</html>
